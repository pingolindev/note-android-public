# R8 minification + KSP are the heap-hungry steps: 4G for the Gradle
# daemon, 3G for the Kotlin daemon.
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx3072m
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# AGP 9's new DSL and built-in Kotlin are switched off because Hilt/KSP do
# not support them; these opt-outs print deprecation warnings and go away in
# AGP 10.0.
android.builtInKotlin=false
android.newDsl=false

# Reuse the configured task graph between invocations.
#
# A build run with --no-daemon configures the whole project from cold on every
# invocation; the configuration cache makes that cost survive across
# invocations instead.
#
# Measured on this project: ~3s per invocation (:app:testDevGmsDebugUnitTest +
# :app:testDevLibreDebugUnitTest, warm, --rerun: 1m28s -> 1m25s). Small, but it
# is a fixed cost on every invocation, it costs nothing to keep, and it grows
# with the project rather than shrinking. AGP 9.3.1, KSP and Hilt all store an
# entry with ZERO problems.
org.gradle.configuration-cache=true
